<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills Catalog</title>
<meta name="description" content="A catalog of Claude Code skills, each installable as a plugin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --font-text: "Geist", system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;

    --bg-page: #fbfbfa;
    --bg-card: #ffffff;
    --bg-subtle: #f3f2ef;
    --bg-subtle-hover: #f6f5f3;

    --text-primary: #1a1a1a;
    --text-body: #3b3a37;
    --text-secondary: #55534f;
    --text-muted: #6b6b6b;
    --text-faint: #8a8780;

    --border: #e7e5e2;
    --divider: #f1f0ed;
    --border-inactive: #c9c6bf;

    --accent: #FF5100;
    --accent-strong: #E64900;
    --accent-soft-bg: #FFF1EB;
    --accent-soft-border: #FFCBB2;

    --success: #1f7a46;
    --success-bg: #eef7f1;
    --warning: #8a5a00;
    --warning-bg: #fbf6e6;
    --alert: #c2410c;

    --ga-text: #1f7a46;
    --ga-bg: #eef7f1;
    --ga-border: #bfe0cb;
    --pilot-text: #8a5a00;
    --pilot-bg: #fbf6e6;
    --pilot-border: #f2d9a6;

    --code-bg: #1a1a1a;
    --code-text: #e7e5e2;
    --on-accent: #ffffff;

    --radius-card: 12px;
    --radius-control: 8px;
    --radius-badge: 4px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--text-body);
    font-family: var(--font-text);
    font-size: 14px;
    line-height: 1.55;
    overflow-x: hidden;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 40px 16px 64px; }

  header h1 {
    margin: 0 0 4px;
    color: var(--text-primary);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  header p { margin: 0 0 20px; color: var(--text-secondary); }

  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 16px;
  }
  .panel-label { margin: 0 0 8px; color: var(--text-muted); font-size: 13px; font-weight: 500; }

  .cmd {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: var(--radius-control);
    padding: 10px 10px 10px 14px;
  }
  .cmd code {
    flex: 1;
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  button { font: inherit; cursor: pointer; }
  .btn-primary {
    flex: none;
    border: 1px solid var(--accent-strong);
    background: var(--accent-strong);
    color: var(--on-accent);
    font-size: 13px;
    font-weight: 700;
    border-radius: var(--radius-control);
    padding: 6px 14px;
  }
  .btn-primary:hover, .btn-primary:active { outline: 1px solid var(--accent-strong); outline-offset: 1px; }

  .btn-secondary {
    flex: none;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 700;
    border-radius: var(--radius-control);
    padding: 5px 12px;
  }
  .btn-secondary:hover { background: var(--bg-subtle-hover); }

  .copied, .copied:hover { background: var(--success-bg); border-color: var(--ga-border); color: var(--success); outline: none; }

  :focus-visible { outline: 2px solid var(--accent-soft-border); outline-offset: 2px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 24px 0 16px; }
  .search {
    flex: 1 1 260px;
    min-width: 0;
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-control);
    background: var(--bg-card);
    color: var(--text-primary);
    font: inherit;
  }
  .search::placeholder { color: var(--text-faint); }
  .search:focus { outline: none; border-color: var(--accent-soft-border); box-shadow: 0 0 0 3px var(--accent-soft-bg); }

  .filters { display: flex; gap: 6px; }
  .filter {
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--border-inactive);
    border-radius: var(--radius-control);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
  }
  .filter:hover { background: var(--bg-subtle-hover); }
  .filter[aria-pressed="true"] { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); font-weight: 700; }

  .count { margin: 0 0 12px; color: var(--text-muted); font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 16px;
    min-width: 0;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h2 {
    margin: 0;
    min-width: 0;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 500;
    overflow-wrap: anywhere;
  }
  .badge {
    flex: none;
    padding: 1px 7px;
    border: 1px solid;
    border-radius: var(--radius-badge);
    font-size: 12px;
    font-weight: 600;
  }
  .badge-GA { color: var(--ga-text); background: var(--ga-bg); border-color: var(--ga-border); }
  .badge-Pilot { color: var(--pilot-text); background: var(--pilot-bg); border-color: var(--pilot-border); }

  .use-when { margin: 10px 0 4px; color: var(--text-body); font-size: 14px; }
  .use-when strong { color: var(--text-primary); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }
  .tags li { padding: 0 6px; border-radius: var(--radius-badge); background: var(--bg-subtle); color: var(--text-muted); font-size: 12px; }

  .meta {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin: 14px 0 12px;
    padding-top: 12px;
    border-top: 1px solid var(--divider);
  }
  .meta dt { color: var(--text-faint); font-size: 12px; }
  .meta dd { margin: 0; color: var(--text-secondary); font-size: 13px; overflow-wrap: anywhere; }
  .mono { font-family: var(--font-mono); }

  .install {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 6px 6px 10px;
    border: 1px solid var(--divider);
    border-radius: var(--radius-control);
    background: var(--bg-subtle);
  }
  .install code { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12px; color: var(--text-body); overflow-wrap: break-word; }
  .install .btn-secondary { background: var(--bg-card); }
  .install .btn-secondary:hover { background: var(--bg-subtle-hover); }

  /* Whole card opens the file viewer: the name button's ::after covers the card. */
  .card:hover { border-color: var(--border-inactive); }
  .card-open { all: unset; cursor: pointer; }
  .card-open::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius-card); }
  .card-open:focus-visible::after { outline: 2px solid var(--accent-soft-border); outline-offset: 2px; }
  .install { position: relative; z-index: 1; }
  .files-hint { margin: 0 0 8px; color: var(--text-muted); font-size: 12px; }
  .card:hover .files-hint { color: var(--text-secondary); }

  body:has(dialog[open]) { overflow: hidden; }
  dialog {
    width: min(1000px, calc(100vw - 32px));
    max-width: none;
    height: min(720px, calc(100dvh - 32px));
    max-height: none;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    background: var(--bg-card);
    color: var(--text-body);
  }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: var(--text-primary); opacity: 0.4; }

  .viewer-head { position: relative; padding: 16px 56px 12px 16px; border-bottom: 1px solid var(--divider); }
  .viewer-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .viewer-head h2 { margin: 0; color: var(--text-primary); font-family: var(--font-mono); font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
  .viewer-sub { margin: 4px 0 0; color: var(--text-muted); font-size: 13px; overflow-wrap: anywhere; }
  .viewer-sub a, .file-head a { color: var(--text-secondary); }
  .btn-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: var(--radius-control);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 18px;
    line-height: 1;
  }
  .btn-close:hover { background: var(--bg-subtle-hover); }

  .viewer-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 260px minmax(0, 1fr); }
  .tree { overflow: auto; padding: 8px; border-right: 1px solid var(--divider); font-family: var(--font-mono); font-size: 12px; }
  .tree ul { margin: 0; padding: 0 0 0 14px; list-style: none; }
  .tree > ul { padding-left: 0; }
  .tree summary { padding: 3px 6px; border-radius: var(--radius-badge); color: var(--text-secondary); cursor: pointer; overflow-wrap: anywhere; }
  .tree summary:hover { background: var(--bg-subtle-hover); }
  .tree-file {
    display: block;
    width: 100%;
    padding: 3px 6px;
    border: 1px solid transparent;
    border-radius: var(--radius-badge);
    background: none;
    color: var(--text-body);
    font: inherit;
    text-align: left;
    overflow-wrap: anywhere;
  }
  .tree-file:hover { background: var(--bg-subtle-hover); }
  .tree-file[aria-current="true"] { background: var(--accent-soft-bg); border-color: var(--accent-soft-border); color: var(--text-primary); }

  .file { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .file-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; padding: 10px 16px; border-bottom: 1px solid var(--divider); color: var(--text-muted); font-size: 12px; }
  .file-head .mono { color: var(--text-primary); font-size: 12px; overflow-wrap: anywhere; }
  .file pre {
    flex: 1;
    margin: 0;
    overflow: auto;
    padding: 16px;
    background: var(--bg-page);
    color: var(--text-body);
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .file .state { flex: 1; }

  @media (max-width: 640px) {
    .viewer-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .tree { max-height: 34dvh; border-right: 0; border-bottom: 1px solid var(--divider); }
  }

  .state { padding: 32px 16px; text-align: center; color: var(--text-muted); }
  .state.error { color: var(--alert); }

  footer { margin-top: 40px; color: var(--text-faint); font-size: 13px; }
  footer a { color: var(--text-secondary); }

  @media (max-width: 480px) {
    .wrap { padding-top: 24px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .filters { width: 100%; }
    .filter { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Skills Catalog</h1>
    <p id="tagline">Claude Code skills, each packaged as a plugin you can install.</p>
    <section class="panel" aria-labelledby="add-label">
      <p class="panel-label" id="add-label">Add the marketplace once, then install any skill below.</p>
      <div class="cmd">
        <code id="add-cmd">claude plugin marketplace add …</code>
        <button class="btn-primary" type="button" data-copy-target="add-cmd">Copy</button>
      </div>
    </section>
  </header>

  <main>
    <div class="toolbar" role="search">
      <input id="q" class="search" type="search" placeholder="Search by name, description or tag" autocomplete="off" aria-label="Search skills">
      <div class="filters" role="group" aria-label="Filter by lifecycle">
        <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter" type="button" data-filter="GA" aria-pressed="false">GA</button>
        <button class="filter" type="button" data-filter="Pilot" aria-pressed="false">Pilot</button>
      </div>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="grid" id="grid"><p class="state">Loading catalog…</p></div>
  </main>

  <footer id="footer">Generated from the repository's marketplace.json.</footer>
</div>

<dialog id="viewer" aria-labelledby="viewer-title">
  <div class="viewer-head">
    <div class="viewer-title-row">
      <h2 id="viewer-title"></h2>
      <span id="viewer-badge" class="badge"></span>
    </div>
    <p class="viewer-sub"><span class="mono" id="viewer-path"></span><span id="viewer-gh"></span></p>
    <button class="btn-close" type="button" id="viewer-close" aria-label="Close">×</button>
  </div>
  <div class="viewer-body">
    <nav class="tree" id="tree" aria-label="Plugin files"></nav>
    <section class="file" aria-live="polite">
      <div class="file-head" id="file-head"></div>
      <pre id="file-content"></pre>
    </section>
  </div>
</dialog>

<script>
(() => {
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  const q = document.getElementById('q');
  const filterButtons = [...document.querySelectorAll('.filter')];
  let plugins = [];
  let lifecycle = 'all';

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '—';
  const rank = (p) => (p.lifecycle === 'GA' ? 0 : 1);

  async function copy(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = Object.assign(document.createElement('textarea'), { value: text });
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    const label = btn.textContent;
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = label; btn.classList.remove('copied'); }, 1500);
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-copy-target], button[data-copy]');
    if (!btn) return;
    const text = btn.dataset.copy ?? document.getElementById(btn.dataset.copyTarget).textContent;
    copy(text, btn);
  });

  filterButtons.forEach(b => b.addEventListener('click', () => {
    lifecycle = b.dataset.filter;
    filterButtons.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
  q.addEventListener('input', render);

  function matches(p, terms) {
    const hay = [p.name, p.description, ...(p.tags || [])].join(' ').toLowerCase();
    return terms.every(t => hay.includes(t));
  }

  function card(p) {
    const tags = (p.tags || []).map(t => `<li>${esc(t)}</li>`).join('');
    return `<article class="card">
      <div class="card-head">
        <h2><button class="card-open" type="button" data-open="${esc(p.name)}" aria-label="View files of ${esc(p.name)}">${esc(p.name)}</button></h2>
        <span class="badge badge-${esc(p.lifecycle)}">${esc(p.lifecycle)}</span>
      </div>
      <p class="use-when"><strong>Use it when:</strong> ${esc(p.useItWhen)}</p>
      ${tags ? `<ul class="tags" aria-label="Tags">${tags}</ul>` : ''}
      <dl class="meta">
        <div><dt>Owner</dt><dd>${esc(p.owner)}</dd></div>
        <div><dt>Version</dt><dd class="mono">${esc(p.version || '—')}</dd></div>
        <div><dt>Updated</dt><dd>${esc(fmtDate(p.lastUpdated))}</dd></div>
      </dl>
      ${p.fileCount ? `<p class="files-hint">View ${p.fileCount} files →</p>` : ''}
      <div class="install">
        <code>${esc(p.install)}</code>
        <button class="btn-secondary" type="button" data-copy="${esc(p.install)}" aria-label="Copy install command for ${esc(p.name)}">Copy</button>
      </div>
    </article>`;
  }

  function render() {
    const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    const list = plugins
      .filter(p => lifecycle === 'all' || p.lifecycle === lifecycle)
      .filter(p => matches(p, terms))
      .sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
    count.textContent = `${list.length} of ${plugins.length} skills`;
    grid.innerHTML = list.length ? list.map(card).join('') : '<p class="state">No skills match your search.</p>';
  }

  // File viewer. The URL hash (#plugin-name) is the state, so cards are linkable and Back closes the viewer.
  const viewer = document.getElementById('viewer');
  const tree = document.getElementById('tree');
  const fileHead = document.getElementById('file-head');
  const fileContent = document.getElementById('file-content');
  const fileCache = new Map();
  let repo = null;
  let current = null;

  const fmtSize = (n) => n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`;
  const ghLink = (path, kind, label) => repo
    ? `<a href="https://github.com/${esc(repo)}/${kind}/main/${esc(path)}" target="_blank" rel="noopener">${label}</a>` : '';

  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-open]');
    if (btn) location.hash = encodeURIComponent(btn.dataset.open);
  });
  document.getElementById('viewer-close').addEventListener('click', () => viewer.close());
  viewer.addEventListener('click', (e) => { if (e.target === viewer) viewer.close(); });
  viewer.addEventListener('close', () => {
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);
    const opener = current && grid.querySelector(`[data-open="${CSS.escape(current.name)}"]`);
    current = null;
    opener?.focus();
  });
  window.addEventListener('hashchange', route);

  function route() {
    const name = decodeURIComponent(location.hash.slice(1));
    const p = plugins.find(x => x.name === name);
    if (p) openViewer(p);
    else if (viewer.open) viewer.close();
  }

  // Nested folders first, then files, both alphabetical.
  function buildTree(files) {
    const root = { dirs: {}, files: [] };
    for (const f of files) {
      const parts = f.path.split('/');
      let node = root;
      for (const dir of parts.slice(0, -1)) node = node.dirs[dir] ??= { dirs: {}, files: [] };
      node.files.push(f);
    }
    return root;
  }
  function renderTree(node) {
    const dirs = Object.keys(node.dirs).sort().map(d =>
      `<li><details open><summary>${esc(d)}/</summary>${renderTree(node.dirs[d])}</details></li>`);
    const files = node.files.map(f =>
      `<li><button class="tree-file" type="button" data-path="${esc(f.path)}">${esc(f.path.split('/').pop())}</button></li>`);
    return `<ul>${dirs.join('')}${files.join('')}</ul>`;
  }

  function showFile(path) {
    const f = current.files.find(x => x.path === path);
    if (!f) return;
    tree.querySelectorAll('.tree-file').forEach(b => b.setAttribute('aria-current', String(b.dataset.path === path)));
    fileHead.innerHTML = `<span class="mono">${esc(f.path)}</span><span>${fmtSize(f.size)}</span>${ghLink(`${current.plugin.path}/${f.path}`, 'blob', 'View on GitHub')}`;
    fileContent.hidden = f.content === null;
    fileContent.textContent = f.content ?? '';
    fileContent.scrollTop = 0;
    viewer.querySelector('.file > .state')?.remove();
    if (f.content === null) fileHead.insertAdjacentHTML('afterend', `<p class="state">No preview: ${esc(f.reason)}.</p>`);
  }
  tree.addEventListener('click', (e) => {
    const btn = e.target.closest('.tree-file');
    if (btn) showFile(btn.dataset.path);
  });

  async function openViewer(p) {
    document.getElementById('viewer-title').textContent = p.name;
    const badge = document.getElementById('viewer-badge');
    badge.textContent = p.lifecycle;
    badge.className = `badge badge-${p.lifecycle}`;
    document.getElementById('viewer-path').textContent = p.path;
    document.getElementById('viewer-gh').innerHTML = repo ? ` · ${ghLink(p.path, 'tree', 'Open folder on GitHub')}` : '';
    tree.innerHTML = '<p class="state">Loading files…</p>';
    fileHead.innerHTML = '';
    fileContent.textContent = '';
    fileContent.hidden = false;
    viewer.querySelector('.file > .state')?.remove();
    if (!viewer.open) viewer.showModal();
    current = { name: p.name, plugin: p, files: [] };
    try {
      if (!fileCache.has(p.name)) {
        const r = await fetch(`files/${encodeURIComponent(p.name)}.json`, { cache: 'no-cache' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        fileCache.set(p.name, (await r.json()).files);
      }
      if (current?.name !== p.name) return; // another plugin was opened meanwhile
      current.files = fileCache.get(p.name);
      tree.innerHTML = renderTree(buildTree(current.files));
      const first = current.files.find(f => /^skills\/[^/]+\/SKILL\.md$/.test(f.path)) || current.files[0];
      if (first) showFile(first.path);
    } catch (err) {
      tree.innerHTML = `<p class="state error">Could not load files (${esc(err.message)}).</p>`;
    }
  }

  fetch('catalog.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(data => {
      plugins = data.plugins || [];
      repo = data.repo || null;
      document.getElementById('add-cmd').textContent = data.addMarketplace;
      if (data.repo) {
        document.getElementById('footer').innerHTML =
          `Source of truth: <a href="https://github.com/${esc(data.repo)}">${esc(data.repo)}</a>. A personal lab, not production.`;
      }
      render();
      route();
    })
    .catch(err => {
      grid.innerHTML = `<p class="state error">Could not load catalog.json (${esc(err.message)}).</p>`;
    });
})();
</script>
</body>
</html>
