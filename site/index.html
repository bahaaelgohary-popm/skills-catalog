<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills Catalog</title>
<meta name="description" content="A catalog of Claude Code skills, each installable as a plugin.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --font-text: "Geist", system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;

    --bg-page: #fbfbfa;
    --bg-card: #ffffff;
    --bg-subtle: #f3f2ef;
    --bg-subtle-hover: #f6f5f3;

    --text-primary: #1a1a1a;
    --text-body: #3b3a37;
    --text-secondary: #55534f;
    --text-muted: #6b6b6b;
    --text-faint: #8a8780;

    --border: #e7e5e2;
    --divider: #f1f0ed;
    --border-inactive: #c9c6bf;

    --accent: #FF5100;
    --accent-strong: #E64900;
    --accent-soft-bg: #FFF1EB;
    --accent-soft-border: #FFCBB2;

    --success: #1f7a46;
    --success-bg: #eef7f1;
    --warning: #8a5a00;
    --warning-bg: #fbf6e6;
    --alert: #c2410c;

    --ga-text: #1f7a46;
    --ga-bg: #eef7f1;
    --ga-border: #bfe0cb;
    --pilot-text: #8a5a00;
    --pilot-bg: #fbf6e6;
    --pilot-border: #f2d9a6;

    --code-bg: #1a1a1a;
    --code-text: #e7e5e2;
    --on-accent: #ffffff;

    --radius-card: 12px;
    --radius-control: 8px;
    --radius-badge: 4px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--text-body);
    font-family: var(--font-text);
    font-size: 14px;
    line-height: 1.55;
    overflow-x: hidden;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 40px 16px 64px; }

  header h1 {
    margin: 0 0 4px;
    color: var(--text-primary);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  header p { margin: 0 0 20px; color: var(--text-secondary); }

  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 16px;
  }
  .panel-label { margin: 0 0 8px; color: var(--text-muted); font-size: 13px; font-weight: 500; }

  .cmd {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: var(--radius-control);
    padding: 10px 10px 10px 14px;
  }
  .cmd code {
    flex: 1;
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 12px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  button { font: inherit; cursor: pointer; }
  .btn-primary {
    flex: none;
    border: 1px solid var(--accent-strong);
    background: var(--accent-strong);
    color: var(--on-accent);
    font-size: 13px;
    font-weight: 700;
    border-radius: var(--radius-control);
    padding: 6px 14px;
  }
  .btn-primary:hover, .btn-primary:active { outline: 1px solid var(--accent-strong); outline-offset: 1px; }

  .btn-secondary {
    flex: none;
    border: 1px solid var(--border);
    background: var(--bg-subtle);
    color: var(--text-primary);
    font-size: 13px;
    font-weight: 700;
    border-radius: var(--radius-control);
    padding: 5px 12px;
  }
  .btn-secondary:hover { background: var(--bg-subtle-hover); }

  .copied, .copied:hover { background: var(--success-bg); border-color: var(--ga-border); color: var(--success); outline: none; }

  :focus-visible { outline: 2px solid var(--accent-soft-border); outline-offset: 2px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 24px 0 16px; }
  .search {
    flex: 1 1 260px;
    min-width: 0;
    height: 36px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-control);
    background: var(--bg-card);
    color: var(--text-primary);
    font: inherit;
  }
  .search::placeholder { color: var(--text-faint); }
  .search:focus { outline: none; border-color: var(--accent-soft-border); box-shadow: 0 0 0 3px var(--accent-soft-bg); }

  .filters { display: flex; gap: 6px; }
  .filter {
    height: 36px;
    padding: 0 14px;
    border: 1px solid var(--border-inactive);
    border-radius: var(--radius-control);
    background: var(--bg-card);
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
  }
  .filter:hover { background: var(--bg-subtle-hover); }
  .filter[aria-pressed="true"] { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--on-accent); font-weight: 700; }

  .count { margin: 0 0 12px; color: var(--text-muted); font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 16px;
    min-width: 0;
  }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h2 {
    margin: 0;
    min-width: 0;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 500;
    overflow-wrap: anywhere;
  }
  .badge {
    flex: none;
    padding: 1px 7px;
    border: 1px solid;
    border-radius: var(--radius-badge);
    font-size: 12px;
    font-weight: 600;
  }
  .badge-GA { color: var(--ga-text); background: var(--ga-bg); border-color: var(--ga-border); }
  .badge-Pilot { color: var(--pilot-text); background: var(--pilot-bg); border-color: var(--pilot-border); }

  .use-when { margin: 10px 0 4px; color: var(--text-body); font-size: 14px; }
  .use-when strong { color: var(--text-primary); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; padding: 0; list-style: none; }
  .tags li { padding: 0 6px; border-radius: var(--radius-badge); background: var(--bg-subtle); color: var(--text-muted); font-size: 12px; }

  .meta {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin: 14px 0 12px;
    padding-top: 12px;
    border-top: 1px solid var(--divider);
  }
  .meta dt { color: var(--text-faint); font-size: 12px; }
  .meta dd { margin: 0; color: var(--text-secondary); font-size: 13px; overflow-wrap: anywhere; }
  .mono { font-family: var(--font-mono); }

  .install {
    margin-top: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 6px 6px 10px;
    border: 1px solid var(--divider);
    border-radius: var(--radius-control);
    background: var(--bg-subtle);
  }
  .install code { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12px; color: var(--text-body); overflow-wrap: break-word; }
  .install .btn-secondary { background: var(--bg-card); }
  .install .btn-secondary:hover { background: var(--bg-subtle-hover); }

  .state { padding: 32px 16px; text-align: center; color: var(--text-muted); }
  .state.error { color: var(--alert); }

  footer { margin-top: 40px; color: var(--text-faint); font-size: 13px; }
  footer a { color: var(--text-secondary); }

  @media (max-width: 480px) {
    .wrap { padding-top: 24px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .filters { width: 100%; }
    .filter { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Skills Catalog</h1>
    <p id="tagline">Claude Code skills, each packaged as a plugin you can install.</p>
    <section class="panel" aria-labelledby="add-label">
      <p class="panel-label" id="add-label">Add the marketplace once, then install any skill below.</p>
      <div class="cmd">
        <code id="add-cmd">claude plugin marketplace add …</code>
        <button class="btn-primary" type="button" data-copy-target="add-cmd">Copy</button>
      </div>
    </section>
  </header>

  <main>
    <div class="toolbar" role="search">
      <input id="q" class="search" type="search" placeholder="Search by name, description or tag" autocomplete="off" aria-label="Search skills">
      <div class="filters" role="group" aria-label="Filter by lifecycle">
        <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter" type="button" data-filter="GA" aria-pressed="false">GA</button>
        <button class="filter" type="button" data-filter="Pilot" aria-pressed="false">Pilot</button>
      </div>
    </div>
    <p class="count" id="count" aria-live="polite"></p>
    <div class="grid" id="grid"><p class="state">Loading catalog…</p></div>
  </main>

  <footer id="footer">Generated from the repository's marketplace.json.</footer>
</div>

<script>
(() => {
  const grid = document.getElementById('grid');
  const count = document.getElementById('count');
  const q = document.getElementById('q');
  const filterButtons = [...document.querySelectorAll('.filter')];
  let plugins = [];
  let lifecycle = 'all';

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '—';
  const rank = (p) => (p.lifecycle === 'GA' ? 0 : 1);

  async function copy(text, btn) {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const ta = Object.assign(document.createElement('textarea'), { value: text });
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    const label = btn.textContent;
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = label; btn.classList.remove('copied'); }, 1500);
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-copy-target], button[data-copy]');
    if (!btn) return;
    const text = btn.dataset.copy ?? document.getElementById(btn.dataset.copyTarget).textContent;
    copy(text, btn);
  });

  filterButtons.forEach(b => b.addEventListener('click', () => {
    lifecycle = b.dataset.filter;
    filterButtons.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
  q.addEventListener('input', render);

  function matches(p, terms) {
    const hay = [p.name, p.description, ...(p.tags || [])].join(' ').toLowerCase();
    return terms.every(t => hay.includes(t));
  }

  function card(p) {
    const tags = (p.tags || []).map(t => `<li>${esc(t)}</li>`).join('');
    return `<article class="card">
      <div class="card-head">
        <h2>${esc(p.name)}</h2>
        <span class="badge badge-${esc(p.lifecycle)}">${esc(p.lifecycle)}</span>
      </div>
      <p class="use-when"><strong>Use it when:</strong> ${esc(p.useItWhen)}</p>
      ${tags ? `<ul class="tags" aria-label="Tags">${tags}</ul>` : ''}
      <dl class="meta">
        <div><dt>Owner</dt><dd>${esc(p.owner)}</dd></div>
        <div><dt>Version</dt><dd class="mono">${esc(p.version || '—')}</dd></div>
        <div><dt>Updated</dt><dd>${esc(fmtDate(p.lastUpdated))}</dd></div>
      </dl>
      <div class="install">
        <code>${esc(p.install)}</code>
        <button class="btn-secondary" type="button" data-copy="${esc(p.install)}" aria-label="Copy install command for ${esc(p.name)}">Copy</button>
      </div>
    </article>`;
  }

  function render() {
    const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    const list = plugins
      .filter(p => lifecycle === 'all' || p.lifecycle === lifecycle)
      .filter(p => matches(p, terms))
      .sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
    count.textContent = `${list.length} of ${plugins.length} skills`;
    grid.innerHTML = list.length ? list.map(card).join('') : '<p class="state">No skills match your search.</p>';
  }

  fetch('catalog.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(data => {
      plugins = data.plugins || [];
      document.getElementById('add-cmd').textContent = data.addMarketplace;
      if (data.repo) {
        document.getElementById('footer').innerHTML =
          `Source of truth: <a href="https://github.com/${esc(data.repo)}">${esc(data.repo)}</a>. A personal lab, not production.`;
      }
      render();
    })
    .catch(err => {
      grid.innerHTML = `<p class="state error">Could not load catalog.json (${esc(err.message)}).</p>`;
    });
})();
</script>
</body>
</html>
