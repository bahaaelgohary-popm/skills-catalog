name: Catalog

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate plugins and build catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for per-plugin last-commit dates

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugins
        run: |
          claude plugin validate . --strict
          for dir in plugins/*/; do claude plugin validate "$dir" --strict; done

      - name: Catalog checks (catalog.yaml, names match)
        run: node scripts/check-catalog.mjs

      - name: Generate catalog.json
        run: |
          mkdir -p _site
          cp site/index.html _site/
          node scripts/build-catalog.mjs _site
          cat _site/catalog.json

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy catalog page
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate, secrets]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
